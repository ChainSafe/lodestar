[package]
name = "lodestar-leanvm"
version = "0.0.0"
edition = "2024"
publish = false

[lib]
crate-type = ["staticlib"]

[dependencies]
# leanVM's stable prover is its reference; the experimental one is the fast one.
lean_vm = { git = "https://github.com/leanEthereum/leanVM", rev = "ed054a05fe55df30c253e4b76222d024e95a3a9d", features = ["experimental_prover"] }

# leanVM's own release profile, which a git dependency does not bring with it.
[profile.release]
lto = "thin"
codegen-units = 1
