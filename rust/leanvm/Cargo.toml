[package]
name = "lodestar-leanvm"
version = "0.0.0"
edition = "2024"
publish = false

[lib]
crate-type = ["staticlib"]

[dependencies]
# leanVM's stable prover is its reference; the experimental one is the fast one.
lean_vm = { git = "https://github.com/leanEthereum/leanVM", rev = "c5ee9d239e42d0bc8113eb4aee3e2cae5faf1764", features = ["experimental_prover"] }
lean_xmss = { git = "https://github.com/leanEthereum/leanVM", rev = "c5ee9d239e42d0bc8113eb4aee3e2cae5faf1764" }

# leanVM's own release profile, which a git dependency does not bring with it.
[profile.release]
lto = "thin"
codegen-units = 1
