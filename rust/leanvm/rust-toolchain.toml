[toolchain]
channel = "1.99.1"
profile = "minimal"
components = ["clippy", "rustfmt"]
# Every target `build.zig` builds the crate for, so that a cross build needs no `rustup target add`.
targets = [
    "aarch64-apple-darwin",
    "aarch64-unknown-linux-gnu",
    "aarch64-unknown-linux-musl",
    "x86_64-apple-darwin",
    "x86_64-unknown-linux-gnu",
    "x86_64-unknown-linux-musl",
]
