packages:
  - packages/*

linkWorkspacePackages: true

minimumReleaseAge: 2880

minimumReleaseAgeExclude:
  - "@vekexasia/bigint-buffer2"
  - "@chainsafe/*"
  - "@libp2p/*"
  - "libp2p"

nodeLinker: isolated

catalog:
  "@vitest/browser": "^4.0.7"
  "@vitest/browser-playwright": "^4.0.7"
  "@vitest/coverage-v8": "^4.0.7"
  vitest: "^4.0.7"

allowBuilds:
  "@parcel/watcher": true
  "@swc/core": true
  aws-sdk: true
  "@vekexasia/bigint-buffer2": true
  classic-level: true
  core-js: true
  cpu-features: true
  electron: true
  esbuild: true
  nx: true
  ssh2: true

overrides:
  "@libp2p/interface": "link:./temp-deps/js-libp2p/packages/interface"
  "@libp2p/peer-collections": "link:./temp-deps/js-libp2p/packages/peer-collections"
  "@libp2p/tcp": "link:./temp-deps/js-libp2p/packages/transport-tcp"
  "@multiformats/multiaddr": "link:./temp-deps/js-libp2p/node_modules/@multiformats/multiaddr"
  dns-over-http-resolver: "^2.1.1"
  elliptic: ">=6.6.1"
  interface-datastore: "link:./temp-deps/js-libp2p/node_modules/interface-datastore"
  libp2p: "link:./temp-deps/js-libp2p/packages/libp2p"
  loupe: "^2.3.6"
  nan: "^2.19.0"
  # Pin exactly while patches/sigstore@4.0.0.patch is in place (PR #9703).
  # Remove together with the patch once sigstore-js#1709 ships and is consumed
  # by libnpmpublish/lerna-lite.
  sigstore: "4.0.0"
  uint8arraylist: "link:./temp-deps/js-libp2p/node_modules/uint8arraylist"

patchedDependencies:
  sigstore@4.0.0: patches/sigstore@4.0.0.patch
