packages:
  - packages/*

catalog:
  '@chainsafe/lodestar-z': 0.1.1
  '@vitest/browser': ^4.0.7
  '@vitest/browser-playwright': ^4.0.7
  '@vitest/coverage-v8': ^4.0.7
  vitest: ^4.0.7

linkWorkspacePackages: true

minimumReleaseAge: 2880

minimumReleaseAgeExclude:
  - "@vekexasia/bigint-buffer2"
  - "@chainsafe/*"
  - "@libp2p/*"
  - "libp2p"

nodeLinker: isolated

catalog:
  "@vitest/browser": "^4.0.7"
  "@vitest/browser-playwright": "^4.0.7"
  "@vitest/coverage-v8": "^4.0.7"
  vitest: "^4.0.7"

allowBuilds:
  "@parcel/watcher": true
  "@swc/core": true
  aws-sdk: true
  "@vekexasia/bigint-buffer2": true
  classic-level: true
  core-js: true
  cpu-features: true
  electron: true
  esbuild: true
  nx: true
  ssh2: true

onlyBuiltDependencies:
  - '@chainsafe/lodestar-z'
  - '@parcel/watcher'
  - '@swc/core'
  - aws-sdk
  - '@vekexasia/bigint-buffer2'
  - classic-level
  - core-js
  - cpu-features
  - electron
  - esbuild
  - nx
  - ssh2
 
overrides:
  dns-over-http-resolver: "^2.1.1"
  elliptic: ">=6.6.1"
  loupe: "^2.3.6"
  nan: "^2.19.0"