packages:
  - packages/*

allowBuilds:
  "@chainsafe/lodestar-z": true
  "@parcel/watcher": true
  "@swc/core": true
  "@vekexasia/bigint-buffer2": true
  aws-sdk: true
  classic-level: true
  core-js: true
  cpu-features: true
  electron: true
  esbuild: true
  nx: true
  ssh2: true

catalog:
  "@chainsafe/lodestar-z": "0.1.2-rc.9"
  "@vitest/browser": "^4.0.7"
  "@vitest/browser-playwright": "^4.0.7"
  "@vitest/coverage-v8": "^4.0.7"
  vitest: "^4.0.7"

linkWorkspacePackages: true

minimumReleaseAge: 2880

minimumReleaseAgeExclude:
  - "@vekexasia/bigint-buffer2"
  - "@chainsafe/*"
  - "@libp2p/*"
  - "libp2p"

nodeLinker: isolated

onlyBuiltDependencies:
  - "@chainsafe/lodestar-z"

overrides:
  dns-over-http-resolver: "^2.1.1"
  elliptic: ">=6.6.1"
  loupe: "^2.3.6"
  nan: "^2.19.0"
