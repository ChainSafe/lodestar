packages:
  - packages/*

linkWorkspacePackages: true

minimumReleaseAge: 2880

minimumReleaseAgeExclude:
  - "@vekexasia/bigint-buffer2"
  - "@chainsafe/*"
  - "@libp2p/*"
  - "libp2p"

nodeLinker: isolated

catalog:
  "@chainsafe/lodestar-z": "github:chainsafe/lodestar-z#9641074816e1c5b2c2e358ffa70ceb39fad78033"
  "@vitest/browser": "^4.0.7"
  "@vitest/browser-playwright": "^4.0.7"
  "@vitest/coverage-v8": "^4.0.7"
  vitest: "^4.0.7"

allowBuilds:
  "@chainsafe/lodestar-z": true
  "@parcel/watcher": true
  "@swc/core": true
  aws-sdk: true
  "@vekexasia/bigint-buffer2": true
  classic-level: true
  core-js: true
  cpu-features: true
  electron: true
  esbuild: true
  nx: true
  ssh2: true

overrides:
  dns-over-http-resolver: "^2.1.1"
  elliptic: ">=6.6.1"
  loupe: "^2.3.6"
  nan: "^2.19.0"
  # Pin exactly while patches/sigstore@4.0.0.patch is in place (PR #9703).
  # Remove together with the patch once sigstore-js#1709 ships and is consumed
  # by libnpmpublish/lerna-lite.
  sigstore: "4.0.0"

patchedDependencies:
  sigstore@4.0.0: patches/sigstore@4.0.0.patch
