packages:
  - packages/*

linkWorkspacePackages: true

minimumReleaseAge: 2880

minimumReleaseAgeExclude:
  - "@vekexasia/bigint-buffer2"
  - "@chainsafe/*"
  - "@libp2p/*"
  - "libp2p"

nodeLinker: isolated

catalog:
  "@chainsafe/lodestar-z": "^1.0.0"
  "@vitest/browser": "^4.0.7"
  "@vitest/browser-playwright": "^4.0.7"
  "@vitest/coverage-v8": "^4.0.7"
  vitest: "^4.0.7"

allowBuilds:
  "@chainsafe/lodestar-z": true
  "@parcel/watcher": true
  "@swc/core": true
  aws-sdk: true
  "@vekexasia/bigint-buffer2": true
  classic-level: true
  core-js: true
  cpu-features: true
  electron: true
  esbuild: true
  nx: true
  ssh2: true

overrides:
  # Pin exactly while patches/@libp2p__tcp@11.0.13.patch is in place, the patch
  # only applies to this version. Remove together with the patch once
  # js-libp2p#3597 is released.
  "@libp2p/tcp": "11.0.13"
  dns-over-http-resolver: "^2.1.1"
  elliptic: ">=6.6.1"
  loupe: "^2.3.6"
  nan: "^2.19.0"
  # Pin exactly while patches/sigstore@4.0.0.patch is in place (PR #9703).
  # Remove together with the patch once sigstore-js#1709 ships and is consumed
  # by libnpmpublish/lerna-lite.
  sigstore: "4.0.0"

patchedDependencies:
  "@libp2p/tcp@11.0.13": patches/@libp2p__tcp@11.0.13.patch
  sigstore@4.0.0: patches/sigstore@4.0.0.patch
