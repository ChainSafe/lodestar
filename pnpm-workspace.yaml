packages:
  - packages/*

linkWorkspacePackages: true

minimumReleaseAge: 2880

minimumReleaseAgeExclude:
  - "@vekexasia/bigint-buffer2"
  - "@chainsafe/*"
  - "@libp2p/*"
  - "libp2p"

nodeLinker: isolated

catalog:
  "@chainsafe/lodestar-z": github:chainsafe/lodestar-z#cayman/bls-batch
  "@vitest/browser": "^4.0.7"
  "@vitest/browser-playwright": "^4.0.7"
  "@vitest/coverage-v8": "^4.0.7"
  vitest: "^4.0.7"

allowBuilds:
  "@chainsafe/lodestar-z": true
  "@parcel/watcher": true
  "@swc/core": true
  aws-sdk: true
  "@vekexasia/bigint-buffer2": true
  classic-level: true
  core-js: true
  cpu-features: true
  electron: true
  esbuild: true
  nx: true
  ssh2: true

overrides:
  # Use the locally built newer lodestar-z (cayman/bls-batch @69ef4413, requires zig 0.16.0).
  # TODO: switch back to the catalog github ref once the newer commit is published.
  "@chainsafe/lodestar-z": "link:../lodestar-z"
  dns-over-http-resolver: "^2.1.1"
  elliptic: ">=6.6.1"
  loupe: "^2.3.6"
  nan: "^2.19.0"
