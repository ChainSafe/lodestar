version: "3.4"

# Configuration for local monitoring setup with Prometheus and Grafana
# This setup provides monitoring dashboards for a local Lodestar node
#
# HOW TO USE:
# 1. Start your Lodestar beacon node and validator client locally
# 2. Ensure they are running on the default ports:
#    - Beacon node: http://localhost:8008
#    - Validator client: http://localhost:5064
# 3. Run this docker-compose file:
#    docker-compose -f docker/docker-compose.local.yml up --build
# 4. Access the services:
#    - Prometheus metrics: http://localhost:9090
#    - Grafana dashboards: http://localhost:3000
#
# Note: This configuration uses host.docker.internal to connect to your
# local Lodestar instance from within the Docker containers.

services:
  prometheus:
    build:
      context: prometheus
    environment:
      BEACON_URL: host.docker.internal:8008
      VC_URL: host.docker.internal:5064
    restart: always
    volumes:
      - "prometheus:/prometheus"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:9090:9090"

  grafana:
    build:
      context: ..
      dockerfile: docker/grafana
    restart: always
    volumes:
      - "grafana:/var/lib/grafana"
      - "grafana-dashboards:/dashboards"
    environment:
      PROMETHEUS_URL: http://host.docker.internal:9090
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:3000:3000"

volumes:
  prometheus:
  grafana:
  grafana-dashboards:
