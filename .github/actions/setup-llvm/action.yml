name: Setup native build dependencies
description: Install LLVM, CMake, libclang, and the pinned Rust toolchain
runs:
  using: composite
  steps:
    - name: Install Linux dependencies
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install --yes llvm cmake libclang-dev pkg-config
        llvm-objcopy --version
    - name: Install macOS dependencies
      if: runner.os == 'macOS'
      shell: bash
      run: |
        brew list cmake >/dev/null 2>&1 || brew install cmake
        brew list llvm >/dev/null 2>&1 || brew install llvm
        echo "LIBCLANG_PATH=$(brew --prefix llvm)/lib" >> "$GITHUB_ENV"
    - name: Install the pinned Rust toolchain
      shell: bash
      run: rustup toolchain install
