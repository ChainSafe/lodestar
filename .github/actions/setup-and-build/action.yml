name: "Setup and build the repo"
description: "A task to reuse setup steps during multiple jobs"
inputs:
  node:
    description: Node version
    required: true
  zig:
    description: Zig version override (defaults to minimum_zig_version in build.zig.zon)
    default: ""
    required: false
  registry-url:
    description: npm registry URL to write into .npmrc (required for OIDC publish jobs)
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - uses: ./.github/actions/setup-node
      with:
        node: ${{ inputs.node }}
        registry-url: ${{ inputs.registry-url }}

    # Required to build the @lodestar/native workspace package
    - name: Setup Zig
      uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
      with:
        version: ${{ inputs.zig }}

    - name: Create cache key
      id: build-cache
      shell: bash
      # This build cache will be reused among different jobs for the same commit
      run: |
        libc=$(node -p "process.report.getReport().header.glibcVersionRuntime ?? 'none'")
        echo "key=build-cache-v2-${{ runner.os }}-${{ runner.arch }}-libc-${libc}-node-$(node --version)-zig-$(zig version)-preset-${{ env.LODESTAR_PRESET || 'mainnet' }}-${{ github.sha }}" >> $GITHUB_OUTPUT

    - name: Restore build
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      id: cache-build-restore
      with:
        path: |
          lib/
          packages/*/lib
          packages/native/zig-out
          packages/*/.git-data.json
        key: ${{ steps.build-cache.outputs.key }}

    - name: Build
      if: steps.cache-build-restore.outputs.cache-hit != 'true'
      shell: bash
      run: pnpm build

    - name: Refresh cached build metadata
      if: steps.cache-build-restore.outputs.cache-hit == 'true'
      shell: bash
      run: pnpm --filter @chainsafe/lodestar write-git-data

    - name: Check Build
      shell: bash
      run: pnpm check-build

    - name: Cache build artifacts
      if: steps.cache-build-restore.outputs.cache-hit != 'true'
      uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: |
          lib/
          packages/*/lib
          packages/native/zig-out
          packages/*/.git-data.json
        key: ${{ steps.build-cache.outputs.key }}
