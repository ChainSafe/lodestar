name: Tests
# only one can run at a time
concurrency:
  # If PR, cancel prev commits. head_ref = source branch name on pull_request, null if push
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

on:
  push:
    # We intentionally don't run push on feature branches. See PR for rational.
    branches: [unstable, stable]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build
    runs-on: warp-ubuntu-2204-x64-4x
    strategy:
      fail-fast: false
      matrix:
        node: [24, 26]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: "./.github/actions/setup-and-build"
        with:
          node: ${{ matrix.node }}
      - uses: ./.github/actions/upload-build
        with:
          node: ${{ matrix.node }}

      - name: Test root binary exists
        run: ./lodestar --version

      - name: Reject pnpm-lock.yaml changes
        run: .github/workflows/scripts/reject_pnpm_lock_changes.sh
        # Run only on forks
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}

  lint:
    name: Lint
    needs: build
    runs-on: "ubuntu-latest"
    strategy:
      fail-fast: false
      matrix:
        node: [24, 26]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: "./.github/actions/restore-build"
        with:
          node: ${{ matrix.node }}

      - name: Assert pnpm prints no warnings
        run: scripts/assert_no_pnpm_warnings.sh

      - name: Assert @chainsafe/persistent-merkle-tree is not duplicated
        run: scripts/assert_persistent_merkle_tree_dedup.sh

      - name: Lint Code
        run: pnpm lint

      - name: Lint native bindings
        run: pnpm --filter @lodestar/native exec biome ci

      - name: Lint Grafana dashboards
        run: scripts/validate-grafana-dashboards.sh

      - name: Assert ESM module exports
        run: node scripts/assert_exports.mjs

  type-checks:
    name: Type Checks
    needs: build
    runs-on: "ubuntu-latest"
    strategy:
      fail-fast: false
      matrix:
        node: [24, 26]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: "./.github/actions/restore-build"
        with:
          node: ${{ matrix.node }}

      - name: Check Types
        run: pnpm check-types

      - name: README check
        run: pnpm check-readme

  unit-tests:
    name: Unit Tests
    needs: build
    runs-on: warp-ubuntu-2204-x64-4x
    strategy:
      fail-fast: false
      matrix:
        node: [24, 26]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: "./.github/actions/restore-build"
        with:
          node: ${{ matrix.node }}

      - name: Restore interop pubkey cache
        id: interop-pubkey-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: packages/state-transition/test-cache/interop-pubkeys.pkix
          key: interop-pubkeys-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'packages/state-transition/src/testUtils/interopPubkeyCache.ts', 'packages/state-transition/src/testUtils/util.ts', 'packages/state-transition/src/util/interop.ts') }}
          restore-keys: |
            interop-pubkeys-${{ runner.os }}-

      # Cache validator slashing protection data tests
      - name: Restore spec tests cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: packages/validator/spec-tests
          key: spec-test-data-${{ hashFiles('packages/validator/test/spec/params.ts') }}

      - name: Unit tests
        run: pnpm vitest run --project unit --project unit-minimal --coverage

      - name: Save interop pubkey cache
        if: ${{ always() && steps.interop-pubkey-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: packages/state-transition/test-cache/interop-pubkeys.pkix
          key: ${{ steps.interop-pubkey-cache.outputs.cache-primary-key }}

      - name: Upload coverage data
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true
          verbose: true # optional (default = false)
          flags: "unit"

  e2e-tests:
    name: E2E Tests
    runs-on: warp-ubuntu-2204-x64-4x
    needs: build
    strategy:
      fail-fast: false
      matrix:
        node: [24, 26]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: "./.github/actions/restore-build"
        with:
          node: ${{ matrix.node }}

      - name: Load env variables
        uses: ./.github/actions/dotenv

      - name: Run the e2e test environment
        run: scripts/run_e2e_env.sh start

      - name: E2E tests
        run: pnpm test:e2e
        env:
          GOERLI_RPC_URL: ${{ secrets.GOERLI_RPC_URL!=0 && secrets.GOERLI_RPC_URL || env.GOERLI_RPC_DEFAULT_URL }}

      - name: Stop the e2e test environment
        run: scripts/run_e2e_env.sh stop

      - name: Upload debug log test for test env
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: debug-e2e-test-logs-node-${{matrix.node}}
          path: test-logs/e2e-test-env

  browser-tests:
    name: Browser Tests
    runs-on: warp-ubuntu-2204-x64-4x
    needs: build
    strategy:
      fail-fast: false
      matrix:
        node: [24, 26]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: "./.github/actions/restore-build"
        with:
          node: ${{ matrix.node }}
      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install
        run: pnpm playwright install chromium chromium-headless-shell firefox
        timeout-minutes: 15
      - name: Browser tests
        run: |
          export DISPLAY=':99.0'
          Xvfb :99 -screen 0 1024x768x24 > /dev/null 2>&1 &
          pnpm test:browsers

  spec-tests:
    name: Spec tests
    needs: build
    runs-on: warp-ubuntu-2204-x64-4x
    strategy:
      fail-fast: false
      matrix:
        node: [24, 26]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: "./.github/actions/restore-build"
        with:
          node: ${{ matrix.node }}

      # Download spec tests with cache
      - name: Restore spec tests cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            packages/beacon-node/spec-tests
            packages/beacon-node/spec-tests-ssz
            packages/beacon-node/spec-tests-bls
          key: spec-test-data-${{ hashFiles('spec-tests-version.json') }}
      - name: Download spec tests
        run: pnpm download-spec-tests
      # Run them in different steps to quickly identifying which command failed
      # Otherwise just doing `pnpm test:spec` you can't tell which specific suite failed
      # many of the suites have identical names for minimal and mainnet
      - name: Spec tests general
        run: pnpm test:spec:general
        working-directory: packages/beacon-node
      - name: Spec tests bls
        run: pnpm test:spec:bls
        working-directory: packages/beacon-node
      - name: Spec tests minimal
        run: pnpm test:spec:minimal
        working-directory: packages/beacon-node
      - name: Spec tests mainnet
        run: NODE_OPTIONS='--max-old-space-size=4096' pnpm test:spec:mainnet
        working-directory: packages/beacon-node
      - name: Spec tests validator
        run: pnpm test:spec
        working-directory: packages/validator

  spec-tests-native:
    name: Spec tests (native)
    needs: build
    runs-on: warp-ubuntu-2204-x64-4x
    strategy:
      fail-fast: false
      matrix:
        node: [24, 26]
        preset: [mainnet]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: "./.github/actions/restore-build"
        with:
          node: ${{ matrix.node }}
          preset: ${{ matrix.preset }}

      # Download spec tests with cache
      - name: Restore spec tests cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            packages/beacon-node/spec-tests
            packages/beacon-node/spec-tests-ssz
            packages/beacon-node/spec-tests-bls
          key: spec-test-data-${{ hashFiles('spec-tests-version.json') }}
      - name: Download spec tests
        run: pnpm download-spec-tests
      # Run them in different steps to quickly identifying which command failed
      # Otherwise just doing `pnpm test:spec` you can't tell which specific suite failed
      # many of the suites have identical names for minimal and mainnet
      - name: Spec tests ${{ matrix.preset }}
        run: LODESTAR_NATIVE_STATE_TRANSITION=true NODE_OPTIONS='--max-old-space-size=4096' pnpm test:spec:${{ matrix.preset }}
        working-directory: packages/beacon-node

  bindings-test:
    name: Native bindings tests
    runs-on: warp-ubuntu-2204-x64-4x
    needs: build
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/restore-build
        with:
          node: 24
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
      - name: Restore era files cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: fixtures/era
          key: era-files-${{ hashFiles('build.zig.zon', 'scripts/download_era_files.zig') }}
      - name: Download era files
        run: |
          zig build run:download_era_files
      - name: Download ere verifier fixtures
        run: |
          zig build run:download_ere_fixtures
      - name: Test bindings
        run: |
          pnpm --filter @lodestar/native test

  check-native-portability:
    name: Native portability
    runs-on: ubuntu-latest
    needs: [build, bindings-artifacts]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/restore-build
        with:
          node: 24

      - name: Download release platform bindings
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: native-platform-bindings
          path: bindings/artifacts

      - name: Install binutils
        run: sudo apt-get install -y binutils

      - name: Check native module portability
        run: node scripts/ci/check_native_portability.mjs

  zig-build-test:
    name: Zig build and tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - ubuntu-24.04-arm
          - macos-latest
          # - macos-13 # skip because hashtree does not support macos x64 yet
          # - windows-latest # TODO: add Windows CI.

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          cache-key: ${{ matrix.os }}

      # Zig fmt is failing on windows and is redundant to run all platforms. So we run only on linux.
      - name: Check formatting
        if: matrix.os == 'ubuntu-latest'
        run: zig fmt --check .

      # Repo-wide lint rules that `zig fmt` cannot express. Platform independent,
      # so it runs once rather than across the matrix.
      - name: Run tidy lint
        if: matrix.os == 'ubuntu-latest'
        run: |
          zig build test:tidy

      - name: Run hashing tests
        run: |
          zig build test:hashing

      - name: Run persistent_merkle_tree tests
        run: |
          zig build test:persistent_merkle_tree

      - name: Run binding allocator tests
        run: |
          zig build test:bindings_allocator

      - name: Run ssz tests
        run: |
          zig build test:ssz

      - name: Run hex tests
        run: |
          zig build test:hex
      - name: Run bounded_array tests
        run: |
          zig build test:bounded_array
      - name: Run bit_array tests
        run: |
          zig build test:bit_array
      - name: Run cpu_count tests
        run: |
          zig build test:cpu_count
      - name: Run config tests
        run: |
          zig build test:config
      - name: Run constants tests
        run: |
          zig build test:constants
      - name: Run consensus-type tests
        run: |
          zig build test:consensus_types
      - name: Run fork_types tests
        run: |
          zig build test:fork_types
      - name: Run era tests
        run: |
          zig build test:era
      - name: Run preset tests
        run: |
          zig build test:preset
      - name: Run bls tests
        run: |
          zig build test:bls
      - name: Run swap-or-not-shuffle tests
        run: |
          zig build test:swap_or_not_shuffle
      # This module hashes with std or blst depending on the target CPU. The runners' own CPUs
      # select std, while most release builds select blst, so also test the baseline CPU.
      - name: Run swap-or-not-shuffle tests for the release CPU baseline
        run: |
          zig build test:swap_or_not_shuffle -Dcpu=baseline
      - name: Run state-transition tests
        run: |
          zig build test:state_transition
      - name: Run fork-choice tests
        run: |
          zig build test:fork_choice
      - name: Run clock tests
        run: |
          zig build test:clock
      - name: Run beacon-node tests
        run: |
          zig build test:beacon_node
      - name: Run ere_verifier tests
        run: |
          zig build test:ere_verifier

      - name: Build benchmarks
        run: |
          zig build build-exe:bench_hashing build-exe:bench_merkle_gindex build-exe:bench_merkle_node build-exe:bench_ssz_attestation build-exe:bench_ssz_block build-exe:bench_ssz_state build-exe:bench_process_block build-exe:bench_process_epoch build-exe:bench_fork_choice_update_head build-exe:bench_fork_choice_compute_deltas build-exe:bench_fork_choice_on_attestation
      - name: Build gnosis bindings
        run: |
          zig build build-lib:bindings -Dpreset=gnosis

  zig-build-test-slow:
    name: Zig integration tests
    # It takes time to download and run these tests, so we only run them on ubuntu-latest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          cache-key: ubuntu-latest
      - name: Restore spec tests cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: fixtures/era
          key: era-files-${{ hashFiles('build.zig.zon', 'scripts/download_era_files.zig') }}
      - name: Download era files
        run: |
          zig build run:download_era_files
      - name: Run slow int tests
        run: |
          zig build test:int

  zig-spec-test-prep:
    name: Zig spec preparation
    runs-on: ubuntu-latest
    outputs:
      spec-test-version: ${{ steps.spec-test-version.outputs.version }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          cache-key: ubuntu-latest
      - name: Read spec test cache key
        id: spec-test-version
        run: |
          version=$(zig build spec-test-version)
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Restore spec tests cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: test/spec/spec_tests
          key: zig-spec-test-data-${{ steps.spec-test-version.outputs.version }}
      - name: Download spec tests
        run: |
          zig build run:download_spec_tests
      - name: Write spec tests
        run: |
          zig build run:write_spec_tests
      - name: Write ssz_generic spec tests
        run: |
          zig build run:write_ssz_generic_spec_tests
      - name: Write ssz_static spec tests
        run: |
          zig build run:write_ssz_static_spec_tests
      - name: Write BLS spec tests
        run: |
          zig build run:write_bls_spec_tests
      - name: Upload generated test files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: zig-spec-test-generated
          path: |
            test/spec/root*.zig
            test/spec/test_case/
            test/spec/ssz/generic_tests.zig
            test/spec/ssz/static_tests.zig
            test/spec/bls/spec_tests.zig
          overwrite: true

  zig-spec-test-general:
    name: Zig spec tests (${{ matrix.name }})
    runs-on: ubuntu-latest
    needs: zig-spec-test-prep
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ssz generic
            target: ssz_generic_spec_tests
          - name: bls
            target: bls_spec_tests
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          cache-key: ubuntu-latest
      - name: Restore spec tests cache
        id: spec-tests-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: test/spec/spec_tests
          key: zig-spec-test-data-${{ needs['zig-spec-test-prep'].outputs['spec-test-version'] }}
      - name: Download spec tests on cache miss
        if: steps.spec-tests-cache.outputs.cache-hit != 'true'
        run: zig build run:download_spec_tests
      - name: Download generated test files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: zig-spec-test-generated
          path: test/spec
      - name: Run ssz_generic spec tests
        if: matrix.target == 'ssz_generic_spec_tests'
        run: zig build test:ssz_generic_spec_tests
      - name: Run BLS spec tests
        if: matrix.target == 'bls_spec_tests'
        run: zig build test:bls_spec_tests

  zig-spec-test-ssz-static:
    name: Zig spec tests (SSZ static, ${{ matrix.preset }})
    runs-on: ubuntu-latest
    needs: zig-spec-test-prep
    strategy:
      fail-fast: false
      matrix:
        preset: [minimal, mainnet]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          cache-key: ubuntu-latest
      - name: Restore spec tests cache
        id: spec-tests-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: test/spec/spec_tests
          key: zig-spec-test-data-${{ needs['zig-spec-test-prep'].outputs['spec-test-version'] }}
      - name: Download spec tests on cache miss
        if: steps.spec-tests-cache.outputs.cache-hit != 'true'
        run: zig build run:download_spec_tests
      - name: Download generated test files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: zig-spec-test-generated
          path: test/spec
      - name: Run ssz_static spec tests
        run: |
          zig build test:ssz_static_spec_tests -Dpreset=${{ matrix.preset }} -Doptimize=ReleaseSafe

  zig-spec-tests:
    name: Zig spec tests (${{ matrix.preset }}, ${{ matrix.runner }})
    runs-on: ubuntu-latest
    needs: zig-spec-test-prep
    strategy:
      fail-fast: false
      matrix:
        preset: [minimal, mainnet]
        runner:
          - operations
          - epoch_processing
          - sanity
          - rewards
          - transition
          - random
          - fork
          - finality
          - merkle_proof
        include:
          - preset: minimal
            optimize: Debug
          - preset: mainnet
            optimize: ReleaseSafe
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          cache-key: ubuntu-latest
      - name: Restore spec tests cache
        id: spec-tests-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: test/spec/spec_tests
          key: zig-spec-test-data-${{ needs['zig-spec-test-prep'].outputs['spec-test-version'] }}
      - name: Download spec tests on cache miss
        if: steps.spec-tests-cache.outputs.cache-hit != 'true'
        run: zig build run:download_spec_tests
      - name: Download generated test files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: zig-spec-test-generated
          path: test/spec
      - name: Run spec tests - ${{ matrix.preset }} (${{ matrix.runner }})
        run: |
          zig build test:spec_tests -Dpreset=${{ matrix.preset }} -Doptimize=${{ matrix.optimize }} -Dspec_tests.filters=${{ matrix.runner }}

  zig-build-fuzz:
    name: Zig fuzz build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          cache-key: ubuntu-latest
      - name: Install AFL++ and LLVM
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y afl++ llvm
      - name: Verify AFL++ and LLVM are available
        run: |
          afl-cc --version
          if command -v llvm-config >/dev/null 2>&1; then
            llvm-config --version
          else
            llvm-config-18 --version
          fi
      - name: Build fuzz harnesses
        # ReleaseSafe, as Dockerfile.fuzz: the harnesses' asserts and Zig's
        # bounds/overflow checks must stay compiled in, or fuzzing cannot see
        # those bugs. Not Debug: Zig 0.16's `sanitize_c = .full` emits
        # `__ubsan_handle_*` calls into blst's C objects that `afl-cc` can't
        # resolve without `libubsan`.
        run: |
          cd test/fuzz && zig build -Doptimize=ReleaseSafe

  bindings-artifacts:
    name: Native platform builds
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-node
        with:
          node: 24
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
      - name: Build release artifacts
        run: |
          pnpm --filter @lodestar/native exec zapi build-artifacts --optimize ReleaseSafe --zig-cwd .. --artifacts-dir "$PWD/bindings/artifacts"
      - name: Upload platform bindings
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-platform-bindings
          path: bindings/artifacts/*/bindings.node
          if-no-files-found: error
          overwrite: true
          retention-days: 3
