name: Project board CI

# Type-checks and tests the project board reconciler script in isolation.
# Spec: .github/specs/project-automation.md

on:
  pull_request:
    paths:
      - ".github/scripts/project-board/**"
      - ".github/workflows/project-board-ci.yml"

permissions: {}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          check-latest: true
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check reconciler
        run: pnpm exec tsc -p .github/scripts/project-board/tsconfig.json

      - name: Test reconciler
        run: node --test .github/scripts/project-board/compute-status.test.ts .github/scripts/project-board/snapshot.test.ts
