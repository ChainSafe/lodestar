name: Kurtosis sim tests

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *" # Runs at midnight UTC everyday

jobs:
  test:
    timeout-minutes: 60
    name: Build and run Kurtosis (${{ matrix.name }})
    runs-on: warp-ubuntu-2204-x64-4x
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: lodestar and lighthouse
            id: mixed
            config: .github/workflows/assets/kurtosis_sim_test_config.yaml
          - name: gloas and heze forks
            id: forks
            config: .github/workflows/assets/kurtosis_fork_transition_config.yaml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build Docker image - local only
        run: >
          docker buildx build . --pull --load \
            --tag chainsafe/lodestar:kurtosis-ci \
            --build-arg COMMIT=$(git rev-parse HEAD)
      - name: Run test
        uses: ethpandaops/kurtosis-assertoor-github-action@f64942cbc780df731a731ea9f45765b161d2c8df # v1.0.1
        with:
          ethereum_package_args: ${{ matrix.config }}
          enclave_name: gh-${{ github.run_id }}-${{ matrix.id }}

      - name: Check that both nodes finalize past the heze fork
        if: matrix.id == 'forks'
        env:
          ENCLAVE: gh-${{ github.run_id }}-forks
          HEZE_FORK_EPOCH: 2
        run: |
          for node in cl-1-lodestar-reth cl-2-lodestar-reth; do
            api="$(kurtosis port print "$ENCLAVE" "$node" http)"
            heze="$(curl -sf "$api/eth/v1/config/spec" | jq -r .data.HEZE_FORK_VERSION)"
            [ -n "$heze" ] || { echo "$node: no HEZE_FORK_VERSION in the spec"; exit 1; }
            for _ in $(seq 1 90); do
              fork="$(curl -sf "$api/eth/v1/beacon/states/head/fork" | jq -r .data.current_version || true)"
              finalized="$(curl -sf "$api/eth/v1/beacon/states/head/finality_checkpoints" | jq -r .data.finalized.epoch || echo 0)"
              [ "$fork" = "$heze" ] && [ "${finalized:-0}" -ge $((HEZE_FORK_EPOCH + 2)) ] && break
              sleep 10
            done
            echo "$node: head fork $fork (heze $heze), finalized epoch $finalized"
            [ "$fork" = "$heze" ] && [ "${finalized:-0}" -ge $((HEZE_FORK_EPOCH + 2)) ] || exit 1
          done

      - name: Dump the enclave after the fork checks
        if: failure() && matrix.id == 'forks'
        run: kurtosis enclave dump "gh-${{ github.run_id }}-forks" "$RUNNER_TEMP/enclave-dump-forks" || true

      - name: Upload the enclave dump after the fork checks
        if: failure() && matrix.id == 'forks'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: enclave-dump-gh-${{ github.run_id }}-forks-checked
          path: ${{ runner.temp }}/enclave-dump-forks
          if-no-files-found: ignore
