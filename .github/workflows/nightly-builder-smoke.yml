name: Kurtosis Builder Nightly Smoke Test

on:
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * *" # 2 am UTC

concurrency:
  group: builder-nightly
  cancel-in-progress: false

env:
  ENCLAVE: builder-dev
  BUILDER_TEMP: ./temp/builder-dev
  # Pinned by hand rather than via the ethpandaops action (used by the sim tests)
  # so a red nightly can only mean a Lodestar change, not an upstream Kurtosis release.
  KURTOSIS_VERSION: "1.20.0"

jobs:
  test:
    name: Build and run Kurtosis builder setup
    runs-on: warp-ubuntu-2204-x64-4x
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - run: pnpm install --frozen-lockfile

      - name: Set up Kurtosis
        run: |
          echo "deb [trusted=yes] https://sdk.kurtosis.com/kurtosis-cli-release-artifacts/ /" \
            | sudo tee /etc/apt/sources.list.d/kurtosis.list
          sudo apt-get update
          sudo apt-get install -y "kurtosis-cli=${KURTOSIS_VERSION}"
          kurtosis analytics disable

      - name: Build
        run: pnpm build

      - name: Build image and start devnet
        run: ./scripts/kurtosis/run-builder.sh

      - name: Run builder smoke check
        env:
          # non-default to avoid clashing with local beacon/validator metrics ports
          METRICS_PORT: 5077
        run: |
          set -euo pipefail

          PUBKEY="0x$(jq -r .pubkey "$BUILDER_TEMP/keystore.json")"
          BN_URL="$(kurtosis port print "$ENCLAVE" cl-2-lodestar-geth http)"

          # wait for BN to be healthy
          timeout 120 bash -c "until curl -sf $BN_URL/eth/v1/node/health >/dev/null; do sleep 3; done"

          START_FINALIZED="$(curl -sf "$BN_URL/eth/v1/beacon/states/head/finality_checkpoints" \
            | jq -r .data.finalized.epoch)"

          LODESTAR_PRESET=minimal ./lodestar builder \
            --keystore "$BUILDER_TEMP/keystore.json" \
            --keystorePassword "$BUILDER_TEMP/password.txt" \
            --builderPubkey "$PUBKEY" \
            --beaconNodeUrl "$BN_URL" \
            --executionFeeRecipient 0x8943545177806ed17b9f23f0a21ee5948ecaa776 \
            --paramsFile "$BUILDER_TEMP/netcfg/config.yaml" \
            --metrics \
            --metrics.port "$METRICS_PORT" \
            > builder.log 2>&1 &
          BUILDER_PID=$!
          trap 'kill "$BUILDER_PID" 2>/dev/null || true' EXIT

          alive() { kill -0 "$BUILDER_PID" 2>/dev/null; }
          died() { echo "builder $1"; wait "$BUILDER_PID" || echo "exit code: $?"; exit 1; }

          # readiness: metrics server up (bounded to ~4 minimal epochs)
          timeout 240 bash -c \
            'until curl -sf localhost:'"$METRICS_PORT"'/metrics >/dev/null; do kill -0 '"$BUILDER_PID"' || exit 1; sleep 3; done'
          alive || died "exited before metrics server came up"

          # builder reaches active (status gauge is set once per epoch)
          timeout 360 bash -c \
            'until curl -sf localhost:'"$METRICS_PORT"'/metrics | grep -q "^bc_builder_status 1$"; do kill -0 '"$BUILDER_PID"' || exit 1; sleep 6; done'
          alive || died "exited before becoming active"

          # soak ~3 epochs
          for _ in $(seq 1 24); do
            alive || died "exited during soak"
            sleep 6
          done

          END_FINALIZED="$(curl -sf "$BN_URL/eth/v1/beacon/states/head/finality_checkpoints" \
            | jq -r .data.finalized.epoch)"
          if [ "$END_FINALIZED" -le "$START_FINALIZED" ]; then
            echo "finality did not advance ($START_FINALIZED -> $END_FINALIZED)"; exit 1
          fi

          if grep -qE '\]\s+error:' builder.log; then
            echo "error-level lines in builder.log"; exit 1
          fi

          echo "smoke check passed"

      - name: Dump enclave
        if: failure()
        run: kurtosis enclave dump "$ENCLAVE" ./enclave-dump || true

      - name: Upload diagnostics
        # temporarily `always` to see initial logs, switch to `failure()` once stable
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: builder-smoke-diagnostics
          path: |
            builder.log
            enclave-dump/
          if-no-files-found: ignore

      - name: Cleanup
        if: always()
        run: |
          kurtosis enclave rm -f "$ENCLAVE" || true
          kurtosis engine stop || true
