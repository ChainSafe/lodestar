name: Build and publish Docker images

on:
  workflow_call:
    inputs:
      tag:
        description: "Docker image tag"
        required: true
        type: string
      extra-tags:
        description: "Extra tags to apply (comma-separated, e.g. 'latest,rc')"
        required: false
        type: string
      ref:
        description: "Git ref to checkout (defaults to triggering ref)"
        required: false
        type: string

jobs:
  docker:
    name: Build Docker (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            runner: warp-ubuntu-2204-x64-4x
          - arch: arm64
            runner: warp-ubuntu-latest-arm64-4x
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push lodestar
        run: >
          docker buildx build . --push
          --tag chainsafe/lodestar:${{ inputs.tag }}-${{ matrix.arch }}
          --platform linux/${{ matrix.arch }}
          --build-arg COMMIT=$(git rev-parse HEAD)

      - name: Sanity check lodestar (${{ matrix.arch }})
        run: |
          docker run -d --name lodestar-sanity-${{ matrix.arch }} -p 9596:9596 chainsafe/lodestar:${{ inputs.tag }}-${{ matrix.arch }} dev --rest.address 0.0.0.0
          sleep 30
          curl -f http://127.0.0.1:9596/eth/v1/node/version || (docker logs lodestar-sanity-${{ matrix.arch }} && exit 1)
          docker stop lodestar-sanity-${{ matrix.arch }}

      - name: Build and push custom Grafana
        run: >
          docker buildx build ./docker/grafana/ --push
          --file ./docker/grafana/Dockerfile
          --build-context dashboards=./dashboards
          --tag chainsafe/lodestar-grafana:${{ inputs.tag }}-${{ matrix.arch }}
          --platform linux/${{ matrix.arch }}

      - name: Build and push custom Prometheus
        run: >
          docker buildx build ./docker/prometheus/ --push
          --file ./docker/prometheus/Dockerfile
          --tag chainsafe/lodestar-prometheus:${{ inputs.tag }}-${{ matrix.arch }}
          --platform linux/${{ matrix.arch }}

  docker-manifest:
    name: Create Docker manifest
    runs-on: ubuntu-latest
    needs: docker
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create and push lodestar manifest
        run: |
          EXTRA_TAGS=""
          if [ -n "${{ inputs.extra-tags }}" ]; then
            for t in $(echo "${{ inputs.extra-tags }}" | tr ',' ' '); do
              EXTRA_TAGS="$EXTRA_TAGS -t chainsafe/lodestar:$t"
            done
          fi
          docker buildx imagetools create -t chainsafe/lodestar:${{ inputs.tag }} $EXTRA_TAGS \
            chainsafe/lodestar:${{ inputs.tag }}-amd64 \
            chainsafe/lodestar:${{ inputs.tag }}-arm64

      - name: Mirror lodestar manifest to Swarm registry (Uncloud Registry)
        # Opt-in mirror of the multi-arch lodestar manifest to a Swarm-backed
        # OCI registry (Ethereum Swarm via the Uncloud Registry). Inert unless
        # the SWARM_REGISTRY repo variable is set, so it is a no-op by default.
        # PoC: https://github.com/lodekeeper/lodestar-swarm-registry-poc
        #
        # Uses `regctl image copy` rather than `docker buildx imagetools create`:
        # the target is a separate registry that does not already hold the layers,
        # and imagetools create only writes the top-level index (its referenced
        # blobs must already exist in the destination), so a real registry-to-registry
        # copy of the manifest list + child manifests + blobs is required.
        if: ${{ vars.SWARM_REGISTRY != '' }}
        env:
          SWARM_REGISTRY: ${{ vars.SWARM_REGISTRY }}
          SWARM_REGISTRY_USERNAME: ${{ secrets.SWARM_REGISTRY_USERNAME }}
          SWARM_REGISTRY_PASSWORD: ${{ secrets.SWARM_REGISTRY_PASSWORD }}
        run: |
          if [ -n "$SWARM_REGISTRY_USERNAME" ]; then
            echo "$SWARM_REGISTRY_PASSWORD" | docker login "$SWARM_REGISTRY" -u "$SWARM_REGISTRY_USERNAME" --password-stdin
          fi
          # regctl does a full multi-arch registry-to-registry copy (manifests + blobs),
          # reading the docker login credentials above from ~/.docker/config.json.
          curl -fsSL -o regctl "https://github.com/regclient/regclient/releases/latest/download/regctl-linux-amd64"
          chmod +x regctl
          ./regctl image copy "chainsafe/lodestar:${{ inputs.tag }}" "$SWARM_REGISTRY/chainsafe/lodestar:${{ inputs.tag }}"
          if [ -n "${{ inputs.extra-tags }}" ]; then
            for t in $(echo "${{ inputs.extra-tags }}" | tr ',' ' '); do
              ./regctl image copy "chainsafe/lodestar:${{ inputs.tag }}" "$SWARM_REGISTRY/chainsafe/lodestar:$t"
            done
          fi

      - name: Create and push grafana manifest
        run: |
          docker buildx imagetools create -t chainsafe/lodestar-grafana:${{ inputs.tag }} \
            chainsafe/lodestar-grafana:${{ inputs.tag }}-amd64 \
            chainsafe/lodestar-grafana:${{ inputs.tag }}-arm64

      - name: Create and push prometheus manifest
        run: |
          docker buildx imagetools create -t chainsafe/lodestar-prometheus:${{ inputs.tag }} \
            chainsafe/lodestar-prometheus:${{ inputs.tag }}-amd64 \
            chainsafe/lodestar-prometheus:${{ inputs.tag }}-arm64

      - name: Verify lodestar manifest
        run: |
          docker pull chainsafe/lodestar:${{ inputs.tag }}
          docker image history chainsafe/lodestar:${{ inputs.tag }}
