# Lodestar only, through the gloas and heze forks. The EL has to support the heze EL fork (bogota) incl. FOCIL,
# nethermind and reth default branches do, geth, besu, erigon, nimbus-eth1 and ethrex do not yet.
participants:
  - el_type: nethermind
    el_image: ethpandaops/nethermind:master
    cl_type: lodestar
    cl_image: chainsafe/lodestar:kurtosis-ci
    count: 2
network_params:
  preset: minimal
  gloas_fork_epoch: 1
  heze_fork_epoch: 2
additional_services:
  - assertoor
assertoor_params:
  run_stability_check: true
  run_block_proposal_check: true
  run_transaction_test: true
  run_blob_transaction_test: true
