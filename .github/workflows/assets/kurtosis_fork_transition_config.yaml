# Lodestar only, through the gloas and heze forks. The EL has to support the heze EL fork (bogota) incl. FOCIL,
# reth and nethermind default branches do, geth, besu, erigon, nimbus-eth1 and ethrex do not yet.
# No assertoor, its go-eth2-client cannot decode heze blocks yet, the workflow checks the forks through the beacon API.
participants:
  - el_type: reth
    el_image: ethpandaops/reth:main
    cl_type: lodestar
    cl_image: chainsafe/lodestar:kurtosis-ci
    count: 2
network_params:
  preset: minimal
  gloas_fork_epoch: 1
  heze_fork_epoch: 2
