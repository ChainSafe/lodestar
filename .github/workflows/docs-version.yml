name: Version docs

on:
  push:
    tags:
      - "v*"
      - "!v*-rc.*"
      - "!v*-beta.*"
      - "!v*-alpha.*"
      - "!v*-dev.*"

permissions:
  contents: write
  pull-requests: write

jobs:
  version-docs:
    name: Create versioned docs
    runs-on: ubuntu-latest
    steps:
      - name: Get version from tag
        id: version
        run: |
          # Strip the 'v' prefix from the tag
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Versioning docs for: $VERSION"

      - uses: actions/checkout@v4
        with:
          ref: unstable
          # Use a token that can trigger workflows and push to protected branches
          token: ${{ secrets.GH_PAGES_TOKEN }}

      - name: Check if version already exists
        id: check
        run: |
          if [ -f docs/versions.json ] && grep -q "\"${{ steps.version.outputs.version }}\"" docs/versions.json; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Version ${{ steps.version.outputs.version }} already exists, skipping"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Install pnpm
        if: steps.check.outputs.exists == 'false'
        uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        if: steps.check.outputs.exists == 'false'
        with:
          node-version: 24
          check-latest: true
          cache: pnpm

      - name: Install dependencies & build
        if: steps.check.outputs.exists == 'false'
        run: pnpm install --frozen-lockfile && pnpm build

      - name: Generate docs (CLI references, READMEs, assets)
        if: steps.check.outputs.exists == 'false'
        run: pnpm docs:build

      - name: Install docs dependencies
        if: steps.check.outputs.exists == 'false'
        working-directory: docs
        run: pnpm install

      - name: Create docs version snapshot
        if: steps.check.outputs.exists == 'false'
        working-directory: docs
        run: npx docusaurus docs:version ${{ steps.version.outputs.version }}

      - name: Prune old versions (keep last 5)
        if: steps.check.outputs.exists == 'false'
        run: |
          if [ ! -f docs/versions.json ]; then
            echo "No versions.json found, skipping prune"
            exit 0
          fi

          # Get all versions
          VERSIONS=$(cat docs/versions.json | jq -r '.[]')
          COUNT=$(echo "$VERSIONS" | wc -l)

          if [ "$COUNT" -le 5 ]; then
            echo "Only $COUNT versions, no pruning needed"
            exit 0
          fi

          echo "Found $COUNT versions, pruning to keep last 5..."

          # Get versions to remove (all but the first 5)
          TO_REMOVE=$(echo "$VERSIONS" | tail -n +6)

          for OLD_VERSION in $TO_REMOVE; do
            echo "Removing old version: $OLD_VERSION"
            rm -rf "docs/versioned_docs/version-$OLD_VERSION"
            rm -f "docs/versioned_sidebars/version-$OLD_VERSION-sidebars.json"
          done

          # Update versions.json to keep only first 5
          cat docs/versions.json | jq '.[0:5]' > docs/versions.json.tmp
          mv docs/versions.json.tmp docs/versions.json

      - name: Verify docs build
        if: steps.check.outputs.exists == 'false'
        working-directory: docs
        run: npx docusaurus build

      - name: Create pull request
        if: steps.check.outputs.exists == 'false'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GH_PAGES_TOKEN }}
          branch: docs/version-${{ steps.version.outputs.version }}
          base: unstable
          title: "docs: add versioned docs for v${{ steps.version.outputs.version }}"
          body: |
            Automated PR to add versioned documentation for v${{ steps.version.outputs.version }}.

            This was triggered by the `v${{ steps.version.outputs.version }}` release tag.

            Changes:
            - Created docs snapshot in `versioned_docs/version-${{ steps.version.outputs.version }}/`
            - Updated `lastVersion` in `docusaurus.config.ts`
            - Pruned old versions (keeping last 5)
          commit-message: "docs: add versioned docs for v${{ steps.version.outputs.version }}"
          delete-branch: true
