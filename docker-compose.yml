version: "3.4"
services:
  beacon_node:
    image: chainsafe/lodestar:next
    restart: always
    volumes:
      - beacon_node:/data
      - logs:/logs
    env_file: .env
    ports:
      - "9000:9000" # P2P port
    #  - "9596:9596" # REST API port
    command: beacon --dataDir /data --rest --rest.address 0.0.0.0 --metrics --logFile /logs/beacon.log --logFileLevel debug --logFileDailyRotate 5
    # With V8 pointer compression, the heap is limited to a 4GB cage per isolate.
    # Setting --max-old-space-size higher than 4096 is clamped by V8.
    environment:
      NODE_OPTIONS: --max-old-space-size=4096

  prometheus:
    build: docker/prometheus
    restart: always
    volumes:
      - "prometheus:/prometheus"

  grafana:
    build: docker/grafana
    restart: always
    ports:
      - "3000:3000"
    volumes:
      - "grafana:/var/lib/grafana"
      - "grafana-dashboards:/dashboards"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD}

volumes:
  beacon_node:
  logs:
  prometheus:
  grafana:
  grafana-dashboards:
