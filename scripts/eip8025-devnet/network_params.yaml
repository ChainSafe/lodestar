# EIP-8025 Optional Execution Proofs — Mixed Client Devnet
#
# Lodestar + Lighthouse mixed devnet for EIP-8025 interop testing.
#
# Usage:
#   kurtosis run github.com/ethpandaops/ethereum-package --args-file network_params.yaml

participants:
  # Normal Lodestar supernode (produces blocks)
  - el_type: reth
    el_image: ghcr.io/paradigmxyz/reth:latest
    cl_type: lodestar
    cl_image: lodestar:eip8025
    cl_extra_params:
      - --targetPeers=5
    supernode: true
    count: 1
    validator_count: 128

  # Normal Lighthouse supernode (produces blocks)
  - el_type: geth
    el_image: ethereum/client-go:latest
    cl_type: lighthouse
    cl_image: ethpandaops/lighthouse:eth-act-optional-proofs
    cl_extra_params:
      - --target-peers=5
    supernode: true
    count: 1
    validator_count: 128

  # Lodestar zkvm node
  - el_type: reth
    el_image: ghcr.io/paradigmxyz/reth:latest
    cl_type: lodestar
    cl_image: lodestar:eip8025
    cl_extra_params:
      - --activateZkvm
      - --chain.minProofsRequired=1
      - --targetPeers=5
    count: 1
    validator_count: 0

  # Lighthouse zkvm node — interop target
  - el_type: reth
    el_image: ghcr.io/paradigmxyz/reth:latest
    cl_type: lighthouse
    cl_image: ethpandaops/lighthouse:eth-act-optional-proofs
    cl_extra_params:
      - --activate-zkvm
      - --target-peers=5
    count: 1
    validator_count: 0

network_params:
  electra_fork_epoch: 0
  fulu_fork_epoch: 1
  seconds_per_slot: 6

global_log_level: debug

additional_services:
  - dora

port_publisher:
  el:
    enabled: true
    public_port_start: 32000
  cl:
    enabled: true
    public_port_start: 33000
